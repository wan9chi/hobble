[workspace]
members = [
  "crates/creance",
  "crates/creance-engine",
  "crates/creance-proxy",
  "crates/creance-sandbox",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/voidzero-dev/creance"

[workspace.dependencies]
anyhow = "1.0.100"
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.17"
tracing = "0.1.43"
