name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      e2e:
        description: Run ignored networked e2e tests
        required: false
        default: "false"

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          mise exec -- node --version
          mise exec -- pnpm --version
      - name: Format
        run: mise run fmt
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Run ignored e2e tests
        run: mise run e2e
